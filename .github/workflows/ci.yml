name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck && npm run typecheck -w @homepulse/console
      - name: Unit tests, including the 16,384-case guard test
        run: npm test
      - name: Holdout, guard level (fails on any attack allowed or legitimate visit refused)
        run: npm run holdout -- --level guard
      - name: Build the guard package and the console
        run: npm run build
      - name: Golden-path scenarios in DEMO_MODE (offline stand-in)
        run: npm run demo -- --all
      - name: Guard proxy in front of an unchanged third-party server (SmartLock Co)
        run: npm run demo:proxy
      - name: Load test (concurrency, keypad race, webhook flood, large log)
        run: npm run stress:load -- --prefill 20000
